    <text x="888" y="237" fill="#f0abfc" font-size="19" font-weight="700">D / PROPULSION MOTOR</text><text x="888" y="268" fill="#cbd5e1" font-size="16">Start · stop · speed</text>
    <text x="888" y="385" fill="#f0abfc" font-size="19" font-weight="700">F / STEERING MOTOR</text><text x="888" y="416" fill="#cbd5e1" font-size="16">Turns · absolute position</text>
    <rect x="444" y="540" width="310" height="68" rx="12" fill="#39311d" stroke="#facc15" stroke-width="1.5"/>
    <text x="599" y="581" text-anchor="middle" fill="#fde68a" font-size="20" font-weight="700">SPIKE hub battery</text>
